{% extends 'base.html' %}

{% block title %}Eliminar Libro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card text-center border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="card-title mb-0">Confirmar Eliminación</h3>
            </div>
            <div class="card-body">
                <p class="lead">¿Estás seguro de que quieres eliminar el libro "<strong>{{ libro.titulo }}</strong>"?</p>
                <p class="text-danger">Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">Sí, Eliminar</button>
                    <a href="{% url 'detalle_libro' pk=libro.pk %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
